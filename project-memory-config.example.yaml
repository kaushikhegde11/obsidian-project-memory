# project-memory / update-project-memory — configuration
#
# Copy this file to one of the locations below and edit it, OR let the skill ask
# you on first run and write it for you. The skill looks in this order and uses
# the first file it finds:
#
#   1. $PROJECT_MEMORY_CONFIG                                  (explicit override)
#   2. ~/.config/project-memory/config.yaml                    (canonical)
#   3. ~/.claude/skills/project-memory/project-memory-config.yaml   (Claude Code)
#   4. ~/.codex/project-memory-config.yaml                     (Codex)
#
# Prefer the canonical location — one config serves every agent. Real config
# files are gitignored; they hold a machine path.

vault_root: "/absolute/path/to/your/Obsidian/Vault"

# The folder that holds each project's memory folder. Your choice — any folder.
# Examples:
#   "Projects memory"
#   "2. Source Material/Projects"
#   "Areas/Projects"
#   ""                        # the vault root itself
projects_folder: "Projects memory"

# Date style for progress and decision entries.
date_format: "DD-MM-YYYY"     # or YYYY-MM-DD / DD-Mon-YYYY
